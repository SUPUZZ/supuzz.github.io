<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Product images | SUPUZZ</title>
    <meta name="description" content="View SUPUZZ product images.">
    <meta name="robots" content="noindex, follow">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="SUPUZZ">
    <meta property="og:title" content="Product images | SUPUZZ">
    <meta property="og:url" content="https://supuzz.com/gallery.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/product-gallery.css">
    <link rel="icon" href="/images/favicon.ico">
    <meta name="theme-color" content="#FEDD00">
    <link rel="canonical" href="https://supuzz.com/gallery.html">
</head>
<body class="product-gallery-page">
    <main class="gallery-viewer" data-gallery-viewer>
      <a class="gallery-back" href="/en/index.html#products" aria-label="Back to product"><span aria-hidden="true">←</span></a>
      <h1 class="gallery-sr-only" data-gallery-title>Product images</h1>
      <div class="gallery-stage" data-gallery-stage aria-label="Product images">
        <figure class="gallery-frame" data-gallery-frame>
          <img data-gallery-photo alt="" decoding="async">
        </figure>
      </div>
      <div class="gallery-thumbs" role="group" aria-label="Product images" data-gallery-thumbs></div>
    </main>
    <script type="module" src="/js/product-gallery.js"></script>
</body>
</html>
