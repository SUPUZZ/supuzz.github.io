<a class="blog-card" href="{{ href }}" data-category="{{ category }}" aria-label="{{ title }}">
    <div class="blog-card-image">
        <img src="{{ image }}" alt="{{ alt }}" width="{{ width }}" height="{{ height }}" loading="lazy" decoding="async">
    </div>
    <div class="blog-card-body">
        <div class="blog-card-meta">
            <if condition="date">
                <p class="blog-published">
                    <span class="blog-card-calendar" aria-hidden="true"></span>
                    <span class="blog-card-sr-only">{{ label }}</span><time datetime="{{ date }}">{{ dateText }}</time>
                </p>
            </if>
            <span class="blog-card-category" title="{{ categoryLabel || label }}">{{ categoryLabel || label }}</span>
        </div>
        <h3 class="blog-card-title">{{ title }}</h3>
        <p class="blog-card-excerpt">{{ excerpt }}</p>
    </div>
</a>
